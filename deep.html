<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DEEP SCHOOL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: #eee; font-family: sans-serif; transition: opacity 0.5s; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .filter-chip { @apply px-5 py-2 rounded-full bg-zinc-900 text-xs font-bold uppercase transition; }
        .filter-chip.active { @apply bg-rose-600 shadow-lg shadow-rose-600/30; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body style="opacity:0">

    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-xl border-b border-white/5 h-20 flex items-center px-8">
        <div class="text-2xl font-black italic cursor-pointer mr-12" onclick="router.go('home')">DEEP<span class="text-rose-600">SCHOOL</span></div>
        <input type="text" id="search-input" placeholder="Поиск..." class="bg-zinc-900 rounded-xl px-6 py-2 w-full max-w-md border-none outline-none focus:ring-1 ring-rose-600 transition">
        <div class="ml-auto flex gap-6 text-[10px] font-bold uppercase tracking-widest">
            <button onclick="router.go('home')">Видео</button>
            <button onclick="router.go('actors')">Модели</button>
        </div>
    </nav>

    <main class="pt-28 px-8 max-w-[1600px] mx-auto">
        <section id="view-home" class="view-section active">
            <div id="category-bar" class="flex gap-2 overflow-x-auto pb-8 scrollbar-hide"></div>
            <div id="channel-header" class="mb-10 flex items-center gap-6 hidden">
                <img id="ch-img" class="w-20 h-20 rounded-2xl object-cover ring-2 ring-rose-600">
                <div>
                    <h1 id="ch-name" class="text-4xl font-black italic uppercase"></h1>
                    <p id="ch-stats" class="text-rose-600 text-[10px] font-bold mt-1"></p>
                </div>
            </div>
            <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>

        <section id="view-actors" class="view-section">
            <h1 class="text-3xl font-black italic mb-8 uppercase">Наши Модели</h1>
            <div id="actors-grid" class="grid grid-cols-2 md:grid-cols-6 gap-6"></div>
        </section>

        <section id="view-player" class="view-section">
            <div class="max-w-5xl mx-auto">
                <div class="relative group aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl" id="player-container">
                    <video id="main-video" class="w-full h-full"></video>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent flex flex-col justify-end p-6 opacity-0 group-hover:opacity-100 transition-opacity">
                        <div class="relative h-1.5 w-full bg-white/10 rounded-full mb-6 cursor-pointer" id="progress-area">
                            <div id="buffer-bar" class="absolute h-full bg-white/20 w-0"></div>
                            <div id="progress-bar" class="absolute h-full bg-rose-600 w-0"></div>
                        </div>
                        <div class="flex items-center justify-between">
                            <button id="play-pause" class="text-2xl"><i class="fas fa-play"></i></button>
                            <div class="flex items-center gap-4">
                                <span class="text-xs font-mono"><span id="curr-time">00:00</span> / <span id="dur-time">00:00</span></span>
                                <input type="range" id="volume-slider" class="w-20 accent-rose-600" min="0" max="1" step="0.1">
                                <button id="fs-btn"><i class="fas fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-8 flex justify-between items-start">
                    <div>
                        <h1 id="v-title" class="text-3xl font-bold"></h1>
                        <div class="flex gap-4 mt-6 items-center bg-zinc-900 p-2 rounded-2xl w-fit" id="v-actor-link">
                            <img id="v-actor-img" class="w-12 h-12 rounded-xl object-cover">
                            <span id="v-actor-name" class="font-bold pr-4"></span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <div class="bg-zinc-900 rounded-xl flex items-center">
                            <button onclick="app.vote('like')" id="like-btn" class="px-6 py-3 border-r border-white/5"><i class="fas fa-heart"></i> <span id="v-likes"></span></button>
                            <button onclick="app.vote('dislike')" id="dislike-btn" class="px-6 py-3"><i class="fas fa-thumbs-down"></i> <span id="v-dislikes"></span></button>
                        </div>
                        <div class="bg-rose-600 px-6 py-3 rounded-xl text-center">
                            <div id="v-rating" class="text-xl font-black"></div>
                            <div class="text-[8px] uppercase font-bold">Рейтинг</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/components.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
